- name: Generate debug keystore
  run: |
    keytool -genkeypair \
      -v \
      -keystore mobile/android/app/debug.keystore \
      -storepass android \
      -alias androiddebugkey \
      -keypass android \
      -keyalg RSA \
      -keysize 2048 \
      -validity 10000 \
      -dname "CN=Android Debug,O=Android,C=US"